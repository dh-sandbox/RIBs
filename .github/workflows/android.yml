name: CI Android

on: [push, pull_request]

jobs:
  build:
    name: JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    strategy:
      matrix:
        java_version: [17]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java_version }}
      - name: Install Android SDK
        uses: malinskiy/action-android/install-sdk@release/0.1.1
      - name: Gradle Wrapper Validation
        uses: gradle/wrapper-validation-action@v1
      - name: Configure Gradle
        # Gradle configuration install deps
        run: ./gradlew help
      - name: Spot check
        run: ./gradlew spotlessCheck --stacktrace
      - name: Build Project
        run: ./gradlew assemble --stacktrace
      - name: Testing
        run: ./gradlew test jacocoTestReport --stacktrace
      - name: Final Checks
        run: ./gradlew check --stacktrace
      - name: Upload coverage to Qlty
        if: success() || failure()
        uses: qltysh/qlty-action/coverage@v2
        env:
          JACOCO_SOURCE_PATH: >-
            libraries/rib-base/src/main/kotlin
            libraries/rib-compiler-app/src/main/kotlin
            libraries/rib-compiler-test/src/main/kotlin
            libraries/rib-coroutines/src/main/kotlin
            libraries/rib-coroutines-test/src/main/kotlin
            libraries/rib-router-navigator/src/main/kotlin
            libraries/rib-android/src/main/kotlin
            libraries/rib-android-core/src/main/kotlin
            libraries/rib-android-compose/src/main/kotlin
            libraries/rib-debug-utils/src/main/kotlin
            libraries/rib-screen-stack-base/src/main/kotlin
            libraries/rib-test/src/main/kotlin
            libraries/rib-workflow/src/main/kotlin
            libraries/rib-workflow-test/src/main/kotlin
            tooling/rib-intellij-plugin/src/main/kotlin
            tooling/rib-intellij-plugin/src/main/java
            tooling/rib-flipper-plugin/src/main/kotlin
            tooling/utils/intellij-broadcast-core/src/main/java
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: '**/jacocoTestReport.xml'
      - name: Upload snapshot
        run: ./gradlew publish -PmavenCentralUsername="${{ secrets.SonatypeUsername }}" -PmavenCentralPassword="${{ secrets.SonatypePassword }}"
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.java_version == '11'
